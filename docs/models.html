<head>

  <style>
body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8f9fa; color: #212529; }

.card h3 { margin-top: 0; }
.muted { color: #6c757d; }

select { padding: .4rem .6rem; font-size: 1rem; min-width: 280px; }

.hero h1 { margin-top: 0; }
.grid { display: grid; gap: 1rem; }
@media (min-width: 720px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.field-label { font-weight: 600; font-size: .85rem; display: block; margin: .75rem 0 .35rem; }
.scrollbox {
  width: 100%;
  min-height: 4.5em;
  max-height: 12em;
  overflow: auto;
  resize: vertical;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .85rem;
  line-height: 1.4;
  background: #f8f9fa;
  border: 1px solid #dee2e6;
  border-radius: 6px;
  padding: .6rem .75rem;
  color: #212529;
  white-space: pre-wrap;
  box-sizing: border-box;
}
.scrollbox.tall { min-height: 7em; max-height: 16em; }
</style>
</head>
<body>

<header>
  <span class="brand">Cosmetic Pharma DS</span>
  <a href="index.html" class="">Home</a> <a href="compare.html" class="">Compare models</a> <a href="models.html" class="active">Model descriptions</a>
</header>

<main>

<h2>Model descriptions</h2>
<p class="muted">Full specifications for each saved model. Long fields use scrollable text boxes.</p>
<label for="frequency">Frequency</label>
<select id="frequency"><option value="daily">Daily (1-month horizon)</option><option value="monthly">Monthly (1-year horizon)</option></select>
<div id="cards" style="margin-top: 1rem;"></div>
<script>
const SPECS = [{"model": "MIDAS_all", "frequency": "daily", "horizon": "1 month", "model_type": "midas", "predictors": "monthly+weekly+daily", "estimator": "StandardScaler + MultiOutputRegressor(RidgeCV)", "monthly_ids": "GT_visine_us, GT_pollen_allergy_us, GT_eczema_us, GT_eye_drops_us, GT_retinol_us, GT_seasonal_allergies_us", "weekly_ids": "GT_food_allergy_us_nv, GT_allergy_eyes_us, GT_itchy_eyes_us, GT_seasonal_allergies_us", "daily_ids": "GT_itchy_eyes_us, GT_allergy_eyes_us, GT_allergy_eye_drops_us, GT_eye_drops_us", "regressors": null, "description": "U-MIDAS / Almon path model for native daily frequency; predictors=monthly+weekly+daily (incl. Google Trends GT_*); variables selected by out-of-sample endpoint forecast MAE; direct multi-output horizon of 30 periods (1 month)."}, {"model": "MIDAS_daily", "frequency": "daily", "horizon": "1 month", "model_type": "midas", "predictors": "daily", "estimator": "StandardScaler + MultiOutputRegressor(RidgeCV)", "monthly_ids": null, "weekly_ids": null, "daily_ids": "GT_itchy_eyes_us, GT_allergy_eyes_us, GT_allergy_eye_drops_us, GT_eye_drops_us", "regressors": null, "description": "U-MIDAS / Almon path model for native daily frequency; predictors=daily (incl. Google Trends GT_*); variables selected by out-of-sample endpoint forecast MAE; direct multi-output horizon of 30 periods (1 month)."}, {"model": "ProphetX", "frequency": "daily", "horizon": "1 month", "model_type": "prophetx", "predictors": "gt_seasonal_allergies_us, gt_pollen_allergy_us, gt_allergy_eye_drops_us, gt_allergy_eyes_us, gt_mineral_sunscreen_us, gt_itchy_eyes_us, gt_gripe_ar, gt_eye_drops_us", "estimator": "Prophet + contemporaneous regressors; multi-step path uses univariate X forecasts from artifacts/exog_forecasts (fallback: freeze)", "monthly_ids": null, "weekly_ids": null, "daily_ids": null, "regressors": "gt_seasonal_allergies_us, gt_pollen_allergy_us, gt_allergy_eye_drops_us, gt_allergy_eyes_us, gt_mineral_sunscreen_us, gt_itchy_eyes_us, gt_gripe_ar, gt_eye_drops_us", "description": "ProphetX on native daily frequency with 8 contemporaneous regressors (y_t ~ X_t). Holdout/future use forecasted X under I_T (exogenous forecast pipeline); horizon=1 month."}, {"model": "prophet", "frequency": "daily", "horizon": "1 month", "model_type": "prophet", "predictors": "{'daily': False, 'weekly': True, 'yearly': True}", "estimator": "Prophet", "monthly_ids": null, "weekly_ids": null, "daily_ids": null, "regressors": null, "description": "Additive Prophet on native daily frequency; yearly=True, weekly=True, daily=False."}, {"model": "Avg_ex_prophet", "frequency": "monthly", "horizon": "1 year", "model_type": "ensemble", "predictors": "ensemble of MIDAS_all + MIDAS_monthly + ProphetX", "estimator": "PSO + Nelder-Mead weighted mean of member holdout forecasts (WAPE-optimal)", "monthly_ids": null, "weekly_ids": null, "daily_ids": null, "regressors": "MIDAS_all=0.000, MIDAS_monthly=0.857, ProphetX=0.143", "description": "Weighted mean of all models except univariate prophet (MIDAS_all, MIDAS_monthly, ProphetX) on native monthly frequency. Weights from PSO then Nelder-Mead polish to minimize holdout WAPE."}, {"model": "MIDAS_all", "frequency": "monthly", "horizon": "1 year", "model_type": "midas", "predictors": "monthly+weekly+daily", "estimator": "StandardScaler + MultiOutputRegressor(RidgeCV)", "monthly_ids": "GT_mineral_sunscreen_us, GT_seasonal_allergies_us, GT_seasonal_allergies_us_ny, GT_pollen_allergy_us, GT_gripe_ar, GT_allergy_eyes_us", "weekly_ids": "GT_seasonal_allergies_us, GT_mineral_sunscreen_us, GT_gripe_ar, GT_gripe_cl", "daily_ids": "GT_mineral_sunscreen_us, GT_seasonal_allergies_us, GT_seasonal_allergies_us_ny, GT_pollen_allergy_us", "regressors": null, "description": "U-MIDAS / Almon path model for native monthly frequency; predictors=monthly+weekly+daily (incl. Google Trends GT_*); variables selected by out-of-sample endpoint forecast MAE; direct multi-output horizon of 12 periods (1 year)."}, {"model": "MIDAS_monthly", "frequency": "monthly", "horizon": "1 year", "model_type": "midas", "predictors": "monthly", "estimator": "StandardScaler + MultiOutputRegressor(RidgeCV)", "monthly_ids": "GT_mineral_sunscreen_us, GT_seasonal_allergies_us, GT_seasonal_allergies_us_ny, GT_pollen_allergy_us, GT_gripe_ar, GT_allergy_eyes_us", "weekly_ids": null, "daily_ids": null, "regressors": null, "description": "U-MIDAS / Almon path model for native monthly frequency; predictors=monthly (incl. Google Trends GT_*); variables selected by out-of-sample endpoint forecast MAE; direct multi-output horizon of 12 periods (1 year)."}, {"model": "ProphetX", "frequency": "monthly", "horizon": "1 year", "model_type": "prophetx", "predictors": "gt_allergy_eye_drops_us, gt_allergy_eyes_us, gt_antihistamine_eye_drops_us, gt_seasonal_allergies_us_ny, gt_seasonal_allergies_us, gt_itchy_eyes_us, gt_seasonal_allergies_us_il, gt_seasonal_allergies_us_wa", "estimator": "Prophet + contemporaneous regressors; multi-step path uses univariate X forecasts from artifacts/exog_forecasts (fallback: freeze)", "monthly_ids": null, "weekly_ids": null, "daily_ids": null, "regressors": "gt_allergy_eye_drops_us, gt_allergy_eyes_us, gt_antihistamine_eye_drops_us, gt_seasonal_allergies_us_ny, gt_seasonal_allergies_us, gt_itchy_eyes_us, gt_seasonal_allergies_us_il, gt_seasonal_allergies_us_wa", "description": "ProphetX on native monthly frequency with 8 contemporaneous regressors (y_t ~ X_t). Holdout/future use forecasted X under I_T (exogenous forecast pipeline); horizon=1 year."}, {"model": "prophet", "frequency": "monthly", "horizon": "1 year", "model_type": "prophet", "predictors": "{'daily': False, 'weekly': False, 'yearly': True}", "estimator": "Prophet", "monthly_ids": null, "weekly_ids": null, "daily_ids": null, "regressors": null, "description": "Additive Prophet on native monthly frequency; yearly=True, weekly=False, daily=False."}];
const LONG_FIELDS = [
  ["description", "Description", true],
  ["predictors", "Predictors", false],
  ["estimator", "Estimator", false],
  ["monthly_ids", "Monthly predictors", false],
  ["weekly_ids", "Weekly predictors", false],
  ["daily_ids", "Daily predictors", false],
  ["regressors", "Regressors", false],
];
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function hasText(v) {
  if (v === null || v === undefined) return false;
  const t = String(v).trim();
  return t.length > 0 && t.toLowerCase() !== 'nan' && t.toLowerCase() !== 'none' && t.toLowerCase() !== 'null';
}
function field(label, value, tall) {
  return `<label class="field-label">${esc(label)}</label>` +
    `<textarea class="scrollbox${tall ? ' tall' : ''}" readonly>${esc(value)}</textarea>`;
}
function card(row) {
  const parts = [
    `<div class="card"><h3>${esc(row.model)}</h3>`,
    `<dl><dt>Type</dt><dd>${esc(row.model_type || '—')}</dd>`,
    `<dt>Horizon</dt><dd>${esc(row.horizon || '—')}</dd></dl>`
  ];
  for (const [key, label, tall] of LONG_FIELDS) {
    if (hasText(row[key])) parts.push(field(label, row[key], tall));
  }
  parts.push('</div>');
  return parts.join('');
}
function render(freq) {
  const rows = SPECS.filter(r => r.frequency === freq).sort((a,b) => a.model.localeCompare(b.model));
  document.getElementById('cards').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<div class="card">No specifications for this frequency.</div>';
}
document.getElementById('frequency').addEventListener('change', (e) => render(e.target.value));
render('daily');
</script>

</main>
</body>
</html>
